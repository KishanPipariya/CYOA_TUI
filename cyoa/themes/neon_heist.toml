name = "Neon Heist"
description = "A high-pressure cyberpunk infiltration in a city of surveillance, debt, and neon rain."
accent_color = "yellow"
spinner_frames = ["[◢]", "[◣]", "[◤]", "[◥]"]
goals = ["Steal the target prototype", "Get out before the city grid tags you"]
directives = ["Treat alarms, access levels, and crew trust as persistent state.", "Offer choices that balance stealth, speed, and collateral damage."]
opening_inventory = ["Forged Employee Badge", "Disposable Signal Scrambler"]
story_flags = ["job_briefed"]
content_tags = ["cyberpunk", "heist", "infiltration"]
persona = "You are a sharp cyberpunk heist narrator. Choices should be tactical, stylish, and shaped by pressure from systems and people."

prompt = """You are a cyberpunk interactive fiction engine.
Describe the starting scenario where the player begins a covert break-in at a hyper-secure arcology to steal a prototype before dawn.
Provide 2-3 choices for what they can do next.
You MUST provide a creative 'title' for this new adventure in the JSON response.
When the story reaches a definitive conclusion (clean escape, capture, betrayal, etc), set 'is_ending' to true and provide an empty choices list.
Ensure your output is strictly valid JSON matching the requested schema.
"""

[terminal_identity]
standard = "Keyboard-first, glyph-led, compact. Keep tactical information terse and terminal-native."
title_card = """
 _   _ _____ ___  _   _   _   _ _____ ___ ____ _____
| \\ | | ____/ _ \\| \\ | | | | | | ____|_ _/ ___|_   _|
|  \\| |  _|| | | |  \\| | | |_| |  _|  | |\\___ \\ | |
| |\\  | |__| |_| | |\\  | |  _  | |___ | | ___) || |
|_| \\_|_____\\___/|_| \\_| |_| |_|_____|___|____/ |_|
"""
scene_divider = ":: grid / rain / heat-signature ::"

[terminal_identity.loading_glyph_sets]
intrusion = ["[00]", "[01]", "[11]", "[10]"]

[terminal_identity.mood_microcopy]
mysterious = "Signal buried."
combat = "Alarms rising."

[opening_stats]
health = 95
gold = 250
reputation = 1

[[opening_objectives]]
id = "breach_arcology"
text = "Enter the arcology without triggering a district-wide alert."
status = "active"

[faction_reputation]
"Broker Kade" = 2

[npc_affinity]
"Wheelman Suri" = 1

[campaign]
id = "neon_heist"
name = "Neon Heist"
description = "A three-phase arc for breach, extraction, and escape under citywide surveillance."
starting_act_id = "act_one"
starting_chapter_id = "breach"

[[campaign.clocks]]
id = "alert"
label = "ALERT"
description = "How close the arcology grid is to a hard lockdown."
initial = 1
minimum = 0
maximum = 6

[[campaign.clocks]]
id = "heat"
label = "HEAT"
description = "How much citywide attention the crew has drawn."
initial = 0
minimum = 0
maximum = 6

[[campaign.acts]]
id = "act_one"
title = "The Job"
summary = "Break in, steal the prototype, and exit before the grid marks the crew."

[[campaign.acts.chapters]]
id = "breach"
title = "Breach"
summary = "Enter the arcology and establish a route past the public security layer."
directives = ["Treat access, time, and camera coverage as persistent pressure."]

[[campaign.acts.chapters.milestones]]
id = "enter_arcology"
title = "Enter the arcology"
min_turn = 2

[[campaign.acts.chapters]]
id = "extraction"
title = "Extraction"
summary = "Find the prototype and decide what collateral the crew is willing to create."
directives = ["Make every shortcut trade stealth against crew trust or future heat."]

[[campaign.acts.chapters.milestones]]
id = "secure_prototype"
title = "Secure the prototype"
min_turn = 5

[[campaign.acts.chapters]]
id = "getaway"
title = "Getaway"
summary = "Escape through a city that has started to recognize the theft."
directives = ["Resolve the ending through heat, alert level, and remaining crew support."]

[[campaign.acts.chapters.milestones]]
id = "clear_the_grid"
title = "Clear the grid"
min_turn = 8

