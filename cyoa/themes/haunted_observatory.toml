name = "Haunted Observatory"
description = "A gothic mystery inside a storm-lashed observatory where the stars seem to watch back."
accent_color = "magenta"
spinner_frames = ["[☾]", "[☁]", "[⚡]", "[✶]"]
goals = ["Uncover why the observatory was abandoned", "Survive the night without losing your mind"]
directives = ["Keep the supernatural ambiguous at first, then escalate with concrete consequences.", "Let clues, locked spaces, and prior discoveries shape future choices."]
opening_inventory = ["Brass Skeleton Key", "Half-Burned Star Chart"]
story_flags = ["observatory_arrival"]
content_tags = ["gothic", "mystery", "supernatural"]
persona = "You are a gothic mystery narrator. Choices should feel tense, eerie, and rooted in physical clues as much as fear."

prompt = """You are a gothic mystery interactive fiction engine.
Describe the starting scenario where the player arrives at an isolated observatory during a violent storm after receiving a letter from a missing astronomer.
Provide 2-3 choices for what they can do next.
You MUST provide a creative 'title' for this new adventure in the JSON response.
When the story reaches a definitive conclusion (truth revealed, escape, death, possession, etc), set 'is_ending' to true and provide an empty choices list.
Ensure your output is strictly valid JSON matching the requested schema.
"""

[terminal_identity]
standard = "Keyboard-first, text-forward, compact. Favor clue ledgers, terse omens, and transcript-safe ASCII."
title_card = """
  ___  ____  ____  _____ ______     ___  _____ ___  ______   __
 / _ \\| __ )/ ___|| ____|  _ \\ \\   / / \\|_   _/ _ \\|  _ \\ \\ / /
| | | |  _ \\\\___ \\|  _| | |_) \\ \\ / / _ \\ | || | | | |_) \\ V /
| |_| | |_) |___) | |___|  _ < \\ V / ___ \\| || |_| |  _ < | |
 \\___/|____/|____/|_____|_| \\_\\ \\_/_/   \\_\\_| \\___/|_| \\_\\|_|
"""
scene_divider = ":: brass / rain / starless glass ::"

[terminal_identity.loading_glyph_sets]
storm = ["[. ]", "[..]", "[*.]", "[**]"]

[terminal_identity.mood_microcopy]
mysterious = "The dome creaks."
dark = "A star goes out."

[opening_stats]
health = 100
gold = 12
reputation = 0

[[opening_objectives]]
id = "enter_observatory"
text = "Find a way into the sealed observatory before the storm worsens."
status = "active"

[faction_reputation]
"Village Locals" = -1

[npc_affinity]
"Missing Astronomer" = 1

[campaign]
id = "haunted_observatory"
name = "Haunted Observatory"
description = "A clue-driven night investigation through the sealed dome, below-stairs machinery, and the final celestial alignment."
starting_act_id = "act_one"
starting_chapter_id = "sealed_dome"

[[campaign.clocks]]
id = "corruption"
label = "CORR"
description = "How deeply the observatory's influence has marked the player."
initial = 0
minimum = 0
maximum = 6

[[campaign.clocks]]
id = "storm"
label = "STORM"
description = "How close the weather is to trapping everyone inside."
initial = 1
minimum = 0
maximum = 6

[[campaign.acts]]
id = "act_one"
title = "The Watching Dome"
summary = "Enter the observatory, map its locked spaces, and decide which truth to trust."

[[campaign.acts.chapters]]
id = "sealed_dome"
title = "Sealed Dome"
summary = "Get inside and establish the first clue chain before the storm closes."
directives = ["Keep fear grounded in physical clues until the player has enough evidence."]

[[campaign.acts.chapters.milestones]]
id = "make_entry"
title = "Make entry"
min_turn = 2

[[campaign.acts.chapters]]
id = "lower_mechanism"
